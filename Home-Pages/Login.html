<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Bites</title>
    <link rel="stylesheet" href="Css/Login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login-container">

        <!-- ================= Left Panel ================= -->
        <div class="left-panel">
            <div class="overlay"></div>
            <div class="left-content">
                <h1>Your campus food,<br>made simpler.</h1>
            </div>
        </div>

        <!-- ================= Right Panel (Form) ================= -->
        <div class="right-panel">
            <div class="form-wrapper">
                <h2>Welcome Back</h2>
                <p class="form-subtitle">Sign in with your registered email or student ID. Run npm start and open http://127.0.0.1:3000 so authentication is available.</p>

                <form action="#" method="post">
                    <div class="form-group">
                        <label for="email">Email / Student ID</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            <input type="text" id="email" name="identifier" placeholder="you@example.edu or student ID"
                                autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                autocomplete="current-password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <!-- OR Divider -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <p class="register-link">Don't have an account? <a href="Register.html">Create Account</a></p>

                <a href="Home.html" class="back-home-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <polyline points="12 19 5 12 12 5" />
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>

    </div>
    <script src="../Student_Pages/js/app.js"></script>
</body>

</html>
