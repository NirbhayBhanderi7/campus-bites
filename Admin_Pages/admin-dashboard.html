<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBites — Admin Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>

<body>

    <!-- ================= Sidebar ================= -->
    <aside class="admin-sidebar" id="adminSidebar">
        <!-- Logo and Brand -->
        <div class="sidebar-brand-box">
            <div class="brand-icon-sq">
                <!-- Fork & Knife Icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
                    <path d="M15 11v11"></path>
                    <path d="M5 2c0 4 2 6 2 8v12"></path>
                    <path d="M9 2c0 4-2 6-2 8"></path>
                </svg>
            </div>
            <div class="brand-text-col">
                <span class="brand-title">CampusBites</span>
                <span class="brand-subtitle">Admin Portal</span>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="sidebar-nav-list">
            <!-- Dashboard (Active) -->
            <a href="admin-dashboard.html" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
                <span>Dashboard</span>
            </a>

            <!-- Orders -->
            <a href="admin-orders.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Orders</span>
            </a>

            <!-- Canteens -->
            <a href="admin-canteens.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Canteens</span>
            </a>

            <!-- Manage Canteens -->
            <a href="admin-manage-canteens.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3h18v4H3z"></path>
                    <path d="M4 7v14h16V7"></path>
                    <path d="M10 11h4"></path>
                </svg>
                <span>Manage Canteens</span>
            </a>

            <!-- Menu -->
            <a href="admin-menu.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="2" x2="6" y2="22"></line>
                    <line x1="6" y1="2" x2="18" y2="22"></line>
                    <line x1="2" y1="6" x2="22" y2="6"></line>
                    <line x1="2" y1="18" x2="22" y2="18"></line>
                </svg>
                <span>Menu</span>
            </a>
        </nav>

        <!-- Sidebar Footer (Logout) -->
        <div class="sidebar-footer">
            <a href="../Home-Pages/Login.html" class="logout-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- ================= Main Content ================= -->
    <main class="admin-main-wrap">
        <!-- Topbar -->
        <header class="dashboard-topbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1 class="topbar-title">Overview</h1>
            </div>

            <!-- Search and Actions -->
            <div class="topbar-right-controls">
                <div class="search-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="search-input" placeholder="Search orders..." id="adminSearchInput">
                </div>

                <!-- Notification Bell -->
                <button class="topbar-btn" title="Notifications" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notify-badge-dot"></span>
                </button>

                <!-- Help / Support -->
                <button class="topbar-btn" title="Help & Support" aria-label="Help">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </button>

                <!-- Profile Avatar -->
                <div class="user-avatar-btn" title="Admin Profile">
                    <img src="images/avtar.jpeg" alt="Admin Profile" onerror="this.src='images/avtar.jpg';">
                </div>
            </div>
        </header>

        <!-- Metric Stat Cards Grid -->
        <section class="stats-grid">
            <!-- Card 1: Recorded Order Value -->
            <div class="stat-card revenue-card">
                <div class="stat-card-header">
                    <span class="stat-label">Recorded Order Value</span>
                    <div class="stat-badge-icon">
                        <!-- Wallet Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                            <path d="M18 12h.01"></path>
                            <path d="M2 10h20"></path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-footer">
                    <span>Totals from student orders</span>
                </div>
            </div>

            <!-- Card 2: Active Orders -->
            <div class="stat-card white-card">
                <div class="stat-card-header">
                    <span class="stat-label">Active Orders</span>
                    <div class="active-orders-icon">
                        <!-- Cutlery / Order Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
                            <path d="M15 11v11"></path>
                            <path d="M5 2c0 4 2 6 2 8v12"></path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-footer">
                    <span>Orders currently in progress</span>
                </div>
            </div>

            <!-- Card 3: Registered Students -->
            <div class="stat-card white-card">
                <div class="stat-card-header">
                    <span class="stat-label">Registered Students</span>
                    <div class="total-users-icon">
                        <!-- Users Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-footer">
                    <span>Accounts in the local database</span>
                </div>
            </div>
        </section>

        <!-- Lower Analytics & Activity (2 Columns) -->
        <section class="content-two-col">
            <!-- Orders Recorded -->
            <div class="content-panel">
                <div class="panel-header">
                    <h2 class="panel-title">Orders Recorded</h2>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span>Shared database</span>
                    </div>
                </div>

                <!-- Chart Visualization Box -->
                <div class="chart-display-container" id="chartDisplayArea">
                    <div class="chart-placeholder-view" id="chartPlaceholder"></div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="content-panel">
                <div class="panel-header">
                    <h2 class="panel-title">Recent Activity</h2>
                    <a href="admin-orders.html" class="view-all-link">View All</a>
                </div>

                <div class="activity-timeline"></div>
            </div>
        </section>
    </main>

    <script src="../shared/demo-data.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-interactions.js"></script>
</body>

</html>
