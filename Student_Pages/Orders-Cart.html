<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBites — Orders Cart</title>
    <link rel="stylesheet" href="css/Orders-Cart.css">
    <link rel="stylesheet" href="css/responsive-sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- ================= Sidebar ================= -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="images/logo.png" alt="CampusBites Logo" class="sidebar-logo-img">
            <div class="sidebar-brand"></div>
            <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close navigation menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="Student-Dashboard.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="Canteen-Menu.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8h1a4 4 0 010 8h-1" />
                    <path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z" />
                    <line x1="6" y1="1" x2="6" y2="4" />
                    <line x1="10" y1="1" x2="10" y2="4" />
                    <line x1="14" y1="1" x2="14" y2="4" />
                </svg>
                <span>Canteen / Menu</span>
            </a>
            <a href="Orders-Cart.html" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1" />
                    <circle cx="20" cy="21" r="1" />
                    <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
                </svg>
                <span>Orders Cart</span>
            </a>
            <a href="Active-Orders.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
                <span>Active Orders</span>
            </a>
            <a href="Profile.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span>Profile</span>
            </a>
        </nav>
        <a href="Canteen-Menu.html" class="order-now-btn">Order Now</a>
    </aside>

    <!-- Dimmed backdrop overlay for mobile drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ================= Main Content ================= -->
    <main class="main-content">
        <!-- Mobile-Only Topbar with 3-Lines Button -->
        <header class="topbar mobile-topbar-only">
            <div class="topbar-left">
                <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Open navigation menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1 class="topbar-title">CampusBites</h1>
            </div>
            <div class="topbar-actions">
                <div class="avatar">
                    <img src="images/avtar.jpeg" alt="User avatar">
                </div>
            </div>
        </header>
        <div class="cart-page-container">

            <!-- Back to Menu Link -->
            <div class="back-link-wrapper">
                <a href="Canteen-Menu.html" class="back-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Menu</span>
                </a>
            </div>

            <!-- Page Title -->
            <div class="cart-header">
                <h1 class="cart-title">Your Order</h1>
            </div>

            <!-- Two-Column Cart Layout -->
            <div class="cart-grid">

                <!-- Left Column: Cart Items -->
                <section class="cart-items-column"></section>

                <!-- Right Column: Fulfillment & Order Summary -->
                <aside class="cart-sidebar-column">

                    <!-- FULFILLMENT METHOD Card -->
                    <div class="fulfillment-card">
                        <span class="card-title">Fulfillment Method</span>

                        <div class="fulfillment-options">
                            <!-- Pickup (Selected) -->
                            <button type="button" class="fulfillment-btn selected" data-method="pickup">
                                <div class="fulfillment-header-row">
                                    <div class="fulfillment-icon-wrap">
                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                                            <line x1="3" y1="6" x2="21" y2="6" />
                                            <path d="M16 10a4 4 0 0 1-8 0" />
                                        </svg>
                                    </div>
                                    <div class="fulfillment-radio-circle"></div>
                                </div>
                                <span class="fulfillment-name">Pickup</span>
                                <span class="fulfillment-subtext">Counter pickup</span>
                            </button>
                        </div>

                        <!-- Special Instructions -->
                        <div class="special-instructions-section">
                            <label for="special-instructions" class="instructions-label">Special Instructions</label>
                            <textarea id="special-instructions" class="instructions-textarea"
                                placeholder="Any dietary preferences or pickup notes?"></textarea>
                        </div>
                    </div>

                    <!-- ORDER SUMMARY Card -->
                    <div class="order-summary-card">
                        <span class="card-title">Order Summary</span>

                        <div class="summary-rows">
                        </div>

                        <div class="summary-divider"></div>

                        <div class="summary-row total-row">
                            <span class="total-label">Total</span>
                            <span class="total-val">₹0.00</span>
                        </div>

                        <button type="button" class="btn-place-order" id="btnPlaceOrder">
                            <span>Place Order</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>

                        <p class="terms-note">This prototype does not process payments.</p>
                    </div>

                </aside>

            </div>
        </div>
    </main>

    <!-- Toast Notification for Interactions -->
    <div class="toast-notice" id="toastNotice">
        <div class="toast-icon">✓</div>
        <span class="toast-message" id="toastMessage">Order placed successfully!</span>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
