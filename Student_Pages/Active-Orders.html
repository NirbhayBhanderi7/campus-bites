<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBites — Active Orders</title>
    <link rel="stylesheet" href="css/Active-Orders.css">
    <link rel="stylesheet" href="css/responsive-sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- ================= Sidebar ================= -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="images/logo.png" alt="CampusBites Logo" class="sidebar-logo-img">
            <div class="sidebar-brand"></div>
            <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close navigation menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="Student-Dashboard.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>
                <span>Dashboard</span>
            </a>
            <a href="Canteen-Menu.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1" /><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z" /><line x1="6" y1="1" x2="6" y2="4" /><line x1="10" y1="1" x2="10" y2="4" /><line x1="14" y1="1" x2="14" y2="4" /></svg>
                <span>Canteen / Menu</span>
            </a>
            <a href="Orders-Cart.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" /></svg>
                <span>Orders Cart</span>
            </a>
            <a href="Active-Orders.html" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg>
                <span>Active Orders</span>
            </a>
            <a href="Profile.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
                <span>Profile</span>
            </a>
        </nav>
        <a href="Canteen-Menu.html" class="order-now-btn">Order Now</a>
    </aside>

    <!-- Dimmed backdrop overlay for mobile drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ================= Main Content ================= -->
    <main class="main-content">
        <!-- ================= Top Bar ================= -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Open navigation menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1 class="topbar-title">CampusBites</h1>
            </div>

            <div class="topbar-actions">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" placeholder="Search orders...">
                </div>

                <button class="icon-btn" aria-label="Notifications">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 01-3.46 0" />
                    </svg>
                </button>

                <button class="icon-btn cart-btn" aria-label="Cart" data-count="2">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
                    </svg>
                </button>

                <div class="avatar">
                    <img src="images/avtar.jpeg" alt="User avatar">
                </div>
            </div>
        </header>
<!-- 
        ================= Active Orders Page Content ================= -->
        <div class="active-orders-container">
            <section class="order-header-card">
                <div class="order-header-top">
                    <div class="order-heading-group">
                        <h1 class="order-heading"></h1>
                        <p class="order-subtitle"></p>
                    </div>
                    <div class="status-badge"><span class="status-pulse-dot"></span></div>
                </div>
            </section>
            <div class="orders-two-col-grid">
                <section class="order-summary-col">
                    <div class="section-header">
                        <h2 class="section-heading">Order Summary</h2>
                        <span class="items-count-tag"></span>
                    </div>
                    <div class="order-items-list"></div>
                </section>
                <aside class="order-sidebar-col">
                    <div class="card pickup-location-card">
                        <h3 class="card-title">Pickup Location</h3>
                        <div class="pickup-card-body">
                            <div class="location-icon-sq" aria-hidden="true"></div>
                            <div class="location-details">
                                <h4 class="location-canteen-name"></h4>
                                <p class="location-address"></p>
                            </div>
                        </div>
                    </div>
                    <div class="card receipt-card">
                        <h3 class="card-title">Order Total</h3>
                        <div class="receipt-rows-list"></div>
                        <div class="receipt-divider"></div>
                        <div class="receipt-total-row">
                            <span class="receipt-total-label">Total</span>
                            <span class="receipt-total-value"></span>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
