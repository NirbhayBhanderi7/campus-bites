<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Bites</title>
    <link rel="stylesheet" href="Css/Register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="register-container">

        <!-- ================= Left Panel ================= -->
        <div class="left-panel">
            <div class="overlay"></div>
            <div class="left-content">
                <!-- Fork & Knife Icon -->
                <svg class="cutlery-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                    <path d="M7 2v20" />
                    <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
                </svg>

                <h1>Join the Campus Bites<br>community</h1>
                <p>Get fresh, fast, and delicious meals right on campus.<br>Sign up today and skip the line.</p>
            </div>
        </div>

        <!-- ================= Right Panel (Form) ================= -->
        <div class="right-panel">
            <div class="form-wrapper">
                <h2>Create an Account</h2>
                <p class="form-subtitle">Create a student account with the local server. Run npm start and open http://127.0.0.1:3000 to register.</p>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Your full name" maxlength="100" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" name="studentId" placeholder="e.g. 12345678" maxlength="40" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="email">University Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.edu" maxlength="254" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 10 characters" minlength="10" maxlength="128" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password"
                            minlength="10" maxlength="128" autocomplete="new-password" required>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy
                                Policy</a>.</label>
                    </div>

                    <button type="submit" class="btn-register">Register</button>
                </form>

                <p class="login-link">Already have an account? <a href="Login.html">Log in</a></p>

                <a href="Home.html" class="back-home-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <polyline points="12 19 5 12 12 5" />
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>

    </div>
    <script src="../Student_Pages/js/app.js"></script>
</body>

</html>
