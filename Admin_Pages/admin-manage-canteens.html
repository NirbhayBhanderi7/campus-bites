<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Canteens — CampusBites Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="css/admin-pages.css">
</head>

<body>

    <!-- ================= Sidebar ================= -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-brand-box">
            <div class="brand-icon-sq">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
                    <path d="M15 11v11"></path>
                    <path d="M5 2c0 4 2 6 2 8v12"></path>
                    <path d="M9 2c0 4-2 6-2 8"></path>
                </svg>
            </div>
            <div class="brand-text-col">
                <span class="brand-title">CampusBites</span>
                <span class="brand-subtitle">Admin Portal</span>
            </div>
        </div>

        <nav class="sidebar-nav-list">
            <a href="admin-dashboard.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="admin-orders.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <span>Orders</span>
            </a>
            <a href="admin-canteens.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Canteens</span>
            </a>
            <a href="admin-manage-canteens.html" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3h18v4H3z"></path>
                    <path d="M4 7v14h16V7"></path>
                    <path d="M10 11h4"></path>
                </svg>
                <span>Manage Canteens</span>
            </a>
            <a href="admin-menu.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="2" x2="6" y2="22"></line>
                    <line x1="6" y1="2" x2="18" y2="22"></line>
                    <line x1="2" y1="6" x2="22" y2="6"></line>
                    <line x1="2" y1="18" x2="22" y2="18"></line>
                </svg>
                <span>Menu</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="../Home-Pages/Login.html" class="logout-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- ================= Main Content ================= -->
    <main class="admin-main-wrap">
        <!-- Topbar -->
        <header class="dashboard-topbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1 class="topbar-title">Manage Canteens</h1>
            </div>
            <div class="topbar-right-controls">
                <div class="search-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="search-input" placeholder="Search orders...">
                </div>
                <button class="topbar-btn" title="Notifications" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notify-badge-dot"></span>
                </button>
                <button class="topbar-btn" title="Help & Support" aria-label="Help">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </button>
                <div class="user-avatar-btn" title="Admin Profile">
                    <img src="images/avtar.jpeg" alt="Admin Profile" onerror="this.src='images/avtar.jpg';">
                </div>
            </div>
        </header>

        <!-- 3 Metric Cards -->
        <section class="manage-metrics-grid">
            <div class="manage-metric-card">
                <div class="manage-metric-header">
                    <span class="manage-metric-label">Total Canteens</span>
                    <div class="manage-metric-icon metric-icon-orange">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="manage-metric-value">0</div>
            </div>

            <div class="manage-metric-card">
                <div class="manage-metric-header">
                    <span class="manage-metric-label">Active</span>
                    <div class="manage-metric-icon metric-icon-green">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="manage-metric-value">0</div>
            </div>

            <div class="manage-metric-card">
                <div class="manage-metric-header">
                    <span class="manage-metric-label">Inactive</span>
                    <div class="manage-metric-icon metric-icon-red">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </div>
                </div>
                <div class="manage-metric-value">0</div>
            </div>
        </section>

        <!-- Tabs Bar -->
        <div class="tabs-bar">
            <button class="tab-btn active">All Canteens</button>
            <button class="tab-btn">Active</button>
            <button class="tab-btn">Inactive</button>
            <div class="tab-spacer"></div>
            <a href="admin-canteens.html" class="btn-add-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add Canteen
            </a>
        </div>

        <!-- Canteens Table -->
        <section class="manage-table-card">
            <table class="manage-table" id="canteensTable">
                <thead>
                    <tr>
                        <th>Canteen</th>
                        <th>Location</th>
                        <th>Menu Items</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div class="manage-table-footer">
                <span>0 canteens total</span>
                <nav class="table-pagination-nav" aria-label="Pagination"></nav>
            </div>
        </section>
    </main>

    <script src="../shared/demo-data.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-interactions.js"></script>
</body>

</html>
